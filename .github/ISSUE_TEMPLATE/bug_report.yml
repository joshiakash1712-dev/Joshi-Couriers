name: 🐛 Bug Report
description: Create a report to help us improve the Joshi Couriers portal
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help the dispatch team reproduce and solve it.
  - type: input
    id: tracking_id
    attributes:
      label: Affected Tracking ID or Route
      description: If applicable, include the parcel ID (e.g. JC-84920) or corridor segment.
      placeholder: "e.g. JC-84920 (Jalna to Partur)"
    validations:
      required: false
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what you did and what went wrong...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device / Browser
      options:
        - Mobile (Chrome / Android)
        - Mobile (Safari / iOS)
        - Desktop (Chrome)
        - Desktop (Firefox / Edge)
        - Other
    validations:
      required: true
