name: 💡 Feature Request / Corridor Proposal
description: Suggest an enhancement or new corridor stop for Joshi Couriers
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to improve the corridor operations or customer portal? We would love to hear it.
  - type: textarea
    id: feature_desc
    attributes:
      label: Feature Description
      description: What feature would you like to see added?
      placeholder: Describe the feature or improvement...
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Merchant Portal & Consignments
        - Driver Dispatch & Trip Sheets
        - Corridor Routes & Timings
        - Analytics & Financial Reports
        - Other
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: Value & Benefit
      description: How will this help merchants or transporters?
    validations:
      required: false
