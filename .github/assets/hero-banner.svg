<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001858" />
      <stop offset="45%" stop-color="#002888" />
      <stop offset="100%" stop-color="#070D1A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF8E01" />
      <stop offset="100%" stop-color="#FFB347" />
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="960" height="300" rx="16" fill="url(#bgGrad)" />
  <rect width="960" height="300" rx="16" fill="url(#grid)" />

  <!-- Ambient Glows -->
  <circle cx="820" cy="80" r="140" fill="#EF8E01" opacity="0.12" filter="url(#glow)" />
  <circle cx="120" cy="220" r="160" fill="#0038BD" opacity="0.25" filter="url(#glow)" />

  <!-- Brand Logo Container -->
  <g transform="translate(48, 44)">
    <!-- Logo Icon Box -->
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#0038BD" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    <!-- Box Icon -->
    <path d="M 28 14 L 43 22.5 L 43 39.5 L 28 48 L 13 39.5 L 13 22.5 Z" fill="none" stroke="#EF8E01" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M 28 14 L 28 48" stroke="#EF8E01" stroke-width="2" />
    <path d="M 13 22.5 L 28 31 L 43 22.5" fill="none" stroke="#EF8E01" stroke-width="2" />

    <!-- Typography -->
    <text x="72" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">JOSHI COURIERS</text>
    <text x="74" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#EF8E01" letter-spacing="1.5">FAST. RELIABLE. LOCAL. • JALNA ➔ PARTUR ➔ MANTHA</text>
  </g>

  <!-- Live Corridor Badge Top Right -->
  <g transform="translate(680, 48)">
    <rect x="0" y="0" width="232" height="36" rx="18" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <circle cx="20" cy="18" r="4" fill="#10B981" />
    <circle cx="20" cy="18" r="7" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="4;9;4" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">DAILY MORNING DISPATCH</text>
  </g>

  <!-- Corridor Visual Road & Stops Section -->
  <g transform="translate(48, 140)">
    <!-- Road Track Line -->
    <rect x="0" y="28" width="864" height="6" rx="3" fill="rgba(255, 255, 255, 0.12)" />
    <rect x="0" y="28" width="580" height="6" rx="3" fill="url(#goldGrad)" />

    <!-- Stop 1: Jalna -->
    <g transform="translate(0, 0)">
      <circle cx="31" cy="31" r="16" fill="#0038BD" stroke="#FFFFFF" stroke-width="3" />
      <circle cx="31" cy="31" r="6" fill="#EF8E01" />
      <text x="31" y="-8" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF">JALNA</text>
      <text x="31" y="66" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#93C5FD">4:00 - 5:00 AM</text>
      <text x="31" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#94A3B8">Shop Pickups</text>
    </g>

    <!-- Stop 2: Partur -->
    <g transform="translate(420, 0)">
      <circle cx="31" cy="31" r="16" fill="#EF8E01" stroke="#FFFFFF" stroke-width="3" />
      <circle cx="31" cy="31" r="6" fill="#FFFFFF" />
      <text x="31" y="-8" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF">PARTUR</text>
      <text x="31" y="66" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FCD34D">6:00 - 6:30 AM</text>
      <text x="31" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#10B981">Doorstep Handover</text>
    </g>

    <!-- Stop 3: Mantha -->
    <g transform="translate(800, 0)">
      <circle cx="31" cy="31" r="14" fill="#1E293B" stroke="rgba(255,255,255,0.4)" stroke-width="2.5" />
      <circle cx="31" cy="31" r="5" fill="#3B82F6" />
      <text x="31" y="-8" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF">MANTHA</text>
      <text x="31" y="66" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#93C5FD">8:30 AM</text>
      <text x="31" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#94A3B8">Trusted Partner</text>
    </g>

    <!-- Vehicle Marker moving along the route -->
    <g transform="translate(240, 10)">
      <rect x="0" y="0" width="138" height="34" rx="8" fill="#FFFFFF" stroke="#0038BD" stroke-width="1.5" />
      <!-- Small Truck Icon -->
      <path d="M 14 22 L 14 12 L 24 12 L 29 17 L 29 22 Z" fill="#0038BD" />
      <circle cx="18" cy="22" r="2.5" fill="#EF8E01" />
      <circle cx="26" cy="22" r="2.5" fill="#EF8E01" />
      <text x="36" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#002888">MH21 V 6370</text>
    </g>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(48, 260)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">
      Fleet: <tspan fill="#FFFFFF" font-weight="800">Mahindra Maxximo</tspan> • Transporters: <tspan fill="#FFFFFF" font-weight="800">Anant Joshi &amp; Akash Joshi</tspan> • Hand-to-Hand Delivery
    </text>
    <text x="864" y="16" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#10B981">
      ✓ Next Morning 6:30 - 8:30 AM Arrival
    </text>
  </g>
</svg>
