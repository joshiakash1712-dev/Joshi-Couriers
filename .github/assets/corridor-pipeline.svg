<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1528" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="960" height="220" rx="16" fill="url(#pipeGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Section Title -->
  <text x="32" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#EF8E01" letter-spacing="1.5">3-PHASE CANONICAL CORRIDOR PIPELINE</text>
  <text x="32" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Real-time state machine synchronized with Firebase Firestore</text>

  <!-- Connective Track -->
  <line x1="160" y1="130" x2="800" y2="130" stroke="#334155" stroke-width="4" stroke-dasharray="8 6" />

  <!-- Phase 1: Ordered -->
  <g transform="translate(48, 80)">
    <rect x="0" y="0" width="250" height="104" rx="12" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" filter="url(#cardShadow)" />
    <!-- Step Badge -->
    <rect x="16" y="14" width="28" height="28" rx="8" fill="#0038BD" />
    <text x="30" y="33" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF">1</text>
    <text x="54" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#60A5FA">ORDERED</text>
    <text x="54" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94A3B8">Admin Confirmed</text>
    <!-- Description -->
    <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#CBD5E1">Sender books online or shop pickup.</text>
    <text x="16" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#38BDF8">4:00 - 5:00 AM Departure Slot</text>
  </g>

  <!-- Phase 2: Picked -->
  <g transform="translate(355, 80)">
    <rect x="0" y="0" width="250" height="104" rx="12" fill="#1E293B" stroke="#818CF8" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="16" y="14" width="28" height="28" rx="8" fill="#4F46E5" />
    <text x="30" y="33" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF">2</text>
    <text x="54" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#A5B4FC">PICKED</text>
    <text x="54" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94A3B8">In Van (MH21 V 6370)</text>
    <!-- Description -->
    <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#CBD5E1">Loaded by father &amp; son team.</text>
    <text x="16" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#818CF8">6:00 - 6:30 AM Corridor Travel</text>
  </g>

  <!-- Phase 3: Shipped -->
  <g transform="translate(662, 80)">
    <rect x="0" y="0" width="250" height="104" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="16" y="14" width="28" height="28" rx="8" fill="#059669" />
    <text x="30" y="33" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF">3</text>
    <text x="54" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#34D399">SHIPPED</text>
    <text x="54" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94A3B8">Delivered / Handover</text>
    <!-- Description -->
    <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#CBD5E1">Direct doorstep recipient handover.</text>
    <text x="16" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#10B981">6:30 - 8:30 AM In Partur &amp; Mantha</text>
  </g>
</svg>
