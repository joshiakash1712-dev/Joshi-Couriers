<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Joshi Couriers - Fast, Reliable Local Parcel Delivery | Jalna, Partur & Mantha</title>
    <meta name="description" content="Delivering trust across Jalna, Partur, and Mantha. Reliable daily parcel pickup and delivery by Joshi Couriers. Pay on arrival, no advance needed." />
    <meta property="og:title" content="Joshi Couriers - Local Courier Service Jalna & Partur" />
    <meta property="og:description" content="Delivering Trust Across Jalna & Partur. Fast, reliable, doorstep parcel pickup and delivery." />
    <meta property="og:type" content="website" />
    <!-- Google Fonts Poppins and Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
    <!-- Immediate theme bootstrap to prevent flash of unstyled theme on page reload -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('joshi_theme_preference') || localStorage.getItem('theme');
          var isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="font-sans antialiased bg-[#FAFAFC] text-slate-900 selection:bg-[#EF8E01]/20 selection:text-[#0038BD]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
